<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 80" fill="none">
  <!-- Interactive CTA Card · Ragoza Portfolio -->
  <style>
    .card-bg { fill: #161b22; stroke: #30363d; stroke-width: 1.5; }
    .card-title { fill: #f0f6fc; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 17px; font-weight: 600; }
    .card-sub { fill: #8b949e; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 13px; }
    .btn-bg { fill: #f0f6fc; }
    .btn-text { fill: #0d1117; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 14px; font-weight: 700; }
    .logo-path { fill: #f0f6fc; }

    @media (prefers-color-scheme: light) {
      .card-bg { fill: #ffffff; stroke: #d0d7de; stroke-width: 1.5; }
      .card-title { fill: #1f2328; }
      .card-sub { fill: #656d76; }
      .btn-bg { fill: #1f2328; }
      .btn-text { fill: #ffffff; }
      .logo-path { fill: #1f2328; }
    }
  </style>

  <!-- Container -->
  <rect x="1" y="1" width="578" height="78" rx="16" class="card-bg" />

  <!-- Monogram Logo (Left) -->
  <g transform="translate(24, 16) scale(0.12)">
    <path
      class="logo-path"
      fill-rule="evenodd"
      clip-rule="evenodd"
      d="M58 0H366L416 49V100L366 148L264 201L366 260L416 340V402H238V300L104 203V402H0V49ZM104 75H314L104 203Z"
    />
  </g>

  <!-- Text (Center) -->
  <text x="86" y="35" class="card-title">Learn more about my work</text>
  <text x="86" y="57" class="card-sub">Explore full interactive portfolio &amp; live demos</text>

  <!-- Button (Right) -->
  <rect x="430" y="20" width="126" height="40" rx="10" class="btn-bg" />
  <text x="493" y="45" text-anchor="middle" class="btn-text">Click Me ↗</text>
</svg>
